<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planetenweg</title>
</head>
<body>
<!-- Liste der Stationen (hier anpassen) -->
<script src="planeten.js"></script>
<!-- 3D-Anzeige (model-viewer, Version 4.1.0) -->
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.1.0/dist/model-viewer.min.js"></script>

<style>
  /* Layout: eine Spalte – Kopf, (Auswahl nur in der Übersicht), Infotext-Knopf, Bühne, Datenzeile */
  :root {
    --himmel: #0a0d16;
    --flaeche: #141a28;
    --linie: #2a3348;
    --text: #e9edf5;
    --leise: #95a0b4;
    --akzent: #f2c46d;
    --fehler-bg: #45191c;
    --fehler-rand: #c45a5f;
    --schrift: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color-scheme: dark;
  }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--himmel); color: var(--text); font-family: var(--schrift); }
  main {
    max-width: 760px; margin: 0 auto;
    padding-block: 16px 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: grid; gap: 14px;
  }
  .kopf { display: grid; gap: 2px; }
  .kopf small { color: var(--leise); letter-spacing: .08em; text-transform: uppercase; font-size: .75rem; }
  h1 { margin: 0; font-size: 1.6rem; text-wrap: balance; }

  .planeten { display: flex; flex-wrap: wrap; gap: 6px; }
  .planeten button, .modus button {
    font: inherit; font-size: .92rem; color: var(--text); background: var(--flaeche);
    border: 1px solid var(--linie); border-radius: 999px; padding: 6px 12px; cursor: pointer;
  }
  .planeten button[aria-pressed="true"] { border-color: var(--akzent); color: var(--akzent); }
  .leiste { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .modus { display: inline-flex; border: 1px solid var(--linie); border-radius: 999px; padding: 3px; gap: 3px; background: var(--flaeche); }
  .modus button { border: 0; background: transparent; }
  .modus button[aria-pressed="true"] { background: var(--akzent); color: var(--himmel); font-weight: 600; }
  .infotext {
    display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 600;
    color: var(--himmel); background: var(--akzent); border-radius: 999px; padding: 8px 16px;
  }
  .infotext-fehlt { color: var(--leise); font-size: .9rem; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }

  .buehne { position: relative; border: 1px solid var(--linie); border-radius: 14px; overflow: hidden; background: var(--himmel); }
  model-viewer { display: block; width: 100%; height: 60vh; min-height: 320px; max-height: 640px; background: var(--himmel); }
  .umriss {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    border: 1.5px dashed var(--akzent); border-radius: 50%; pointer-events: none; opacity: .75;
  }
  .umriss span {
    position: absolute; left: 50%; top: -1.6em; transform: translateX(-50%);
    color: var(--akzent); font-size: .8rem; white-space: nowrap;
  }

  .daten { color: var(--leise); font-size: .95rem; font-variant-numeric: tabular-nums; margin: 0; }
  .daten strong { color: var(--text); font-weight: 600; }
  .fehler { background: var(--fehler-bg); border: 1px solid var(--fehler-rand); border-radius: 10px; padding: 10px 12px; line-height: 1.45; }
  .fuss { color: var(--leise); font-size: .8rem; margin: 0; }
</style>

<main>
  <header class="kopf">
    <small id="oberzeile">Planetenweg</small>
    <h1 id="titel">Alle Stationen</h1>
  </header>

  <div class="planeten" id="planeten" aria-label="Station auswählen"></div>

  <div class="leiste">
    <a class="infotext" id="infotext" href="#" target="_blank" rel="noopener" hidden>Infotext öffnen</a>
    <span class="infotext-fehlt" id="infotext-fehlt" hidden>Infotext folgt</span>
    <div class="modus" role="group" aria-label="Darstellung">
      <button type="button" id="btn-normiert" aria-pressed="true">Normiert</button>
      <button type="button" id="btn-vergleich" aria-pressed="false">Größenvergleich</button>
    </div>
  </div>

  <div class="fehler" id="fehler" hidden></div>

  <div class="buehne">
    <model-viewer id="viewer"
      alt="3D-Modell des Planeten"
      camera-controls disable-zoom disable-pan touch-action="pan-y"
      interaction-prompt="auto" environment-image="neutral" shadow-intensity="0"
      min-camera-orbit="-Infinity 22.5deg 0m" max-camera-orbit="Infinity 157.5deg 2000m"
      min-field-of-view="10deg" max-field-of-view="45deg">
    </model-viewer>
    <div class="umriss" id="umriss" hidden><span id="umriss-text">Größe von Jupiter</span></div>
  </div>

  <p class="daten" id="daten"></p>
  <p class="fuss">Zum Drehen wischen oder mit der Maus ziehen.</p>
</main>

<script>
  // Die Liste der Stationen steht in planeten.js.
  const RAHMEN = 2.1;   // sichtbarer Bereich im Größenvergleich, in Jupiter-Radien (Platz für Saturnringe)
  const FOV = 30;       // fester Bildwinkel im Größenvergleich (Grad)

  const $ = (id) => document.getElementById(id);
  const mv = $('viewer'), umriss = $('umriss'), fehler = $('fehler'), leiste = $('planeten');
  const ref = PLANETEN.find(p => p.id === REFERENZ);
  const erde = PLANETEN.find(p => p.id === 'erde');
  const zahl = (x, n) => x.toLocaleString('de-DE', { minimumFractionDigits: n, maximumFractionDigits: n });
  const modellDatei = (p) => (window.EINGEBETTET && EINGEBETTET[p.id]) || `modelle/${p.id}.glb`;
  const infotextDatei = (p) => `infotexte/${p.id}.pdf`;
  let index = 0, modus = 'normiert', mass = null;

  const zeigeFehler = (html) => { fehler.innerHTML = html; fehler.hidden = false; };

  PLANETEN.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = p.name;
    b.addEventListener('click', () => zeigePlanet(i));
    leiste.appendChild(b);
  });

  // Welche Station? Steht im QR-Code hinter dem #, z. B. .../#erde
  function start() {
    const id = decodeURIComponent(location.hash.slice(1)).trim().toLowerCase();
    const i = PLANETEN.findIndex(p => p.id === id);
    const station = i >= 0;
    leiste.hidden = station;                       // an einer Station: keine Auswahl, nur dieser Planet
    $('oberzeile').textContent = station ? 'Planetenweg · Station' : 'Planetenweg · Übersicht';
    if (id && !station) zeigeFehler(`<strong>Unbekannte Station „${id}“.</strong> Stimmt der QR-Code?`);
    zeigePlanet(station ? i : Math.max(0, PLANETEN.findIndex(p => p.id === START)));
  }

  function zeigePlanet(i) {
    index = i; mass = null; umriss.hidden = true;
    if (!fehler.textContent.startsWith('Unbekannte')) fehler.hidden = true;
    const p = PLANETEN[i];
    [...leiste.children].forEach((b, k) => b.setAttribute('aria-pressed', k === i));
    $('titel').textContent = p.name;
    document.title = `${p.name} – Planetenweg`;
    mv.setAttribute('alt', `3D-Modell: ${p.name}`);
    mv.setAttribute('scale', '1 1 1');            // erst unverändert laden und messen
    mv.setAttribute('camera-target', 'auto auto auto');
    mv.setAttribute('field-of-view', 'auto');
    mv.setAttribute('camera-orbit', '0deg 75deg auto');
    mv.setAttribute('src', modellDatei(p));
    schreibeDaten();
    pruefeInfotext(p);
  }

  // Infotext-Knopf nur zeigen, wenn die PDF wirklich hochgeladen ist
  async function pruefeInfotext(p) {
    const a = $('infotext'), fehlt = $('infotext-fehlt');
    a.hidden = true; fehlt.hidden = true;
    let da = false;
    try { da = (await fetch(infotextDatei(p), { method: 'HEAD', cache: 'no-store' })).ok; } catch (e) { da = false; }
    if (PLANETEN[index] !== p) return;            // inzwischen anderer Planet gewählt
    a.href = infotextDatei(p);
    a.hidden = !da; fehlt.hidden = da;
  }

  mv.addEventListener('load', () => {
    const d = mv.getDimensions();
    const c = mv.getBoundingBoxCenter();
    // kleinste Ausdehnung = Planetendurchmesser (Saturnringe liegen flach und zählen so nicht mit)
    mass = { d: Math.min(d.x, d.y, d.z), c };
    anwenden();
  });

  mv.addEventListener('error', () => {
    zeigeFehler(`<strong>Modell nicht gefunden:</strong> <code>modelle/${PLANETEN[index].id}.glb</code>. ` +
      'Liegt die Datei im Ordner „modelle“ und stimmt der Name genau (Kleinschreibung)?');
  });

  function abstand() {
    const r = mv.getBoundingClientRect();
    return RAHMEN / (Math.tan(FOV / 2 * Math.PI / 180) * Math.min(1, r.width / r.height));
  }

  function anwenden() {
    if (!mass) return;
    const o = mv.getCameraOrbit();
    const winkel = `${o.theta}rad ${o.phi}rad`;
    if (modus === 'normiert') {
      mv.setAttribute('scale', '1 1 1');
      mv.setAttribute('camera-target', 'auto auto auto');
      mv.setAttribute('field-of-view', 'auto');
      mv.setAttribute('camera-orbit', `${winkel} auto`);
      umriss.hidden = true;
    } else {
      // Planet so skalieren, dass Jupiter den Radius 1 hat; Kamera bleibt immer gleich weit weg
      const s = (PLANETEN[index].durchmesser / ref.durchmesser) * 2 / mass.d;
      mv.setAttribute('scale', `${s} ${s} ${s}`);
      mv.setAttribute('camera-target', `${mass.c.x * s}m ${mass.c.y * s}m ${mass.c.z * s}m`);
      mv.setAttribute('field-of-view', `${FOV}deg`);
      mv.setAttribute('camera-orbit', `${winkel} ${abstand()}m`);
      const r = mv.getBoundingClientRect();
      const px = Math.min(r.width, r.height) / RAHMEN;    // Durchmesser des Jupiter-Umrisses in Pixeln
      umriss.style.width = umriss.style.height = `${px}px`;
      $('umriss-text').textContent = `Größe von ${ref.name}`;
      umriss.hidden = false;   // bei Jupiter selbst liegt der Umriss genau am Planetenrand (Kontrolle)
    }
    if (mv.jumpCameraToGoal) mv.jumpCameraToGoal();
  }

  function schreibeDaten() {
    const p = PLANETEN[index];
    $('daten').innerHTML =
      `<strong>${p.name}</strong> · Ø ${zahl(p.durchmesser, 0)} km · ` +
      `${zahl(p.durchmesser / erde.durchmesser, 2)} × Erde · ${zahl(p.durchmesser / ref.durchmesser, 3)} × ${ref.name}`;
  }

  function setzeModus(m) {
    modus = m;
    $('btn-normiert').setAttribute('aria-pressed', m === 'normiert');
    $('btn-vergleich').setAttribute('aria-pressed', m === 'vergleich');
    anwenden();
  }
  $('btn-normiert').addEventListener('click', () => setzeModus('normiert'));
  $('btn-vergleich').addEventListener('click', () => setzeModus('vergleich'));
  window.addEventListener('resize', () => { if (modus === 'vergleich') anwenden(); });
  window.addEventListener('hashchange', () => { fehler.hidden = true; fehler.textContent = ''; start(); });

  start();

  if (location.protocol === 'file:') {
    zeigeFehler('<strong>Per Doppelklick geöffnet:</strong> So lädt der Browser keine Modelle. ' +
      'Bitte die Seite über GitHub Pages öffnen (siehe Anleitung).');
  } else {
    Promise.race([customElements.whenDefined('model-viewer'), new Promise(ok => setTimeout(() => ok('zeit'), 8000))])
      .then(r => { if (r === 'zeit') zeigeFehler('<strong>Die 3D-Anzeige konnte nicht geladen werden.</strong> Besteht eine Internetverbindung?'); });
  }

</script>
</body>
</html>
